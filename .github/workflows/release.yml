name: Release

# Builds the portable AimAdapt.exe (one file, nothing to install) plus the Windows
# installers. Pushing a tag like v0.1.0 also publishes a GitHub release with them
# attached; running it by hand only uploads them as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installers
        working-directory: crates/aimadapt-app
        run: cargo tauri build
      # The release exe has the UI built in, so it runs on its own as a portable app.
      - name: Portable exe
        shell: bash
        run: |
          mkdir -p portable
          cp target/release/aimadapt-app.exe "portable/AimAdapt_${GITHUB_REF_NAME#v}_x64-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: AimAdapt-windows
          path: |
            portable/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" portable/*.exe target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe --generate-notes
