[package]
name = "aimadapt-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
notify.workspace = true
aimadapt-core = { workspace = true, features = ["serde"] }
aimadapt-engine.workspace = true
aimadapt-sim.workspace = true
aimadapt-sce.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = "2"

[build-dependencies]
tauri-build = "2"

[features]
# Serve the bundled UI as a production build. `cargo tauri build` turns this on;
# scripts/release-exe.sh passes it for a plain `cargo build --release`.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
