[package]
name = "aimadapt-engine"
description = "AimAdapt's built-in aim trainer"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
aimadapt-core.workspace = true
aimadapt-sim.workspace = true
aimadapt-sce.workspace = true

[dev-dependencies]
aimadapt-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[dependencies.bevy]
version = "0.20.1"
default-features = false
# Only what a 3D trainer with a text HUD needs: no audio, glTF, scenes, picking or gamepads.
features = [
    "std",
    "multi_threaded",
    "bevy_winit",
    "default_font",
    "keyboard",
    "mouse",
    "3d_api",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "ui_api",
    "ui_bevy_render",
]

[lints]
workspace = true
