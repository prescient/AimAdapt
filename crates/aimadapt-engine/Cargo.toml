[package]
name = "aimadapt-engine"
description = "AimAdapt's built-in aim trainer"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
aimadapt-core.workspace = true
aimadapt-sim.workspace = true
aimadapt-sce.workspace = true

# The shot, hit and kill sounds (see src/sound.rs): WASAPI on Windows, ALSA on Linux
# (building there needs the ALSA headers, libasound2-dev).
cpal = "0.18.2"

[dev-dependencies]
aimadapt-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[dependencies.bevy]
version = "0.20.1"
default-features = false
# Only what a 3D trainer with a text HUD needs: no glTF, scenes, picking or gamepads, and
# no Bevy audio (the trainer's few sounds go straight to cpal, for a short delay).
features = [
    "std",
    "multi_threaded",
    "bevy_winit",
    "default_font",
    "keyboard",
    "mouse",
    "3d_api",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "ui_api",
    "ui_bevy_render",
]

# For building and testing on Linux: the window needs X11 or Wayland there (Windows
# needs neither). Wayland is used when the desktop runs it, X11 otherwise.
[target.'cfg(target_os = "linux")'.dependencies.bevy]
version = "0.20.1"
default-features = false
features = ["x11", "wayland"]

[lints]
workspace = true
