name = "Shrink Reflex"
description = "Targets shrink and vanish after 1.2 seconds. Hit them before they go. Trains reaction speed."
author = "RustyAim"
category = "clicking"
tags = ["reaction", "timing"]

[timing]
duration_s = 60.0

[targets]
count = 1
radius = 0.4
lifetime_s = 1.2
shrink_to = 0.35
respawn_delay_s = 0.15

[targets.spawn]
distance = [10.0, 10.0]
yaw = [-35.0, 35.0]
pitch = [-6.0, 16.0]
min_separation = 10.0

[scoring]
per_kill = 100.0
per_miss = -10.0
per_timeout = -50.0

[adaptive]
goal = 0.85
knobs = [
    { knob = "lifetime", easy = 2.2, hard = 0.5 },
]
