name = "Timed Wide Flicks"
description = "Targets far from the last one, each on a timer. Trains fast, committed wide flicks."
author = "RustyAim"
category = "clicking"
tags = ["flick", "wide", "timed"]

[timing]
duration_s = 60.0

[targets]
count = 1
radius = 0.3
lifetime_s = 1.4
respawn_delay_s = 0.1

[targets.spawn]
distance = [12.0, 14.0]
yaw = [-65.0, 65.0]
pitch = [-10.0, 22.0]
min_separation = 35.0

[scoring]
per_kill = 100.0
per_miss = -25.0
per_timeout = -50.0

[adaptive]
goal = 0.85
knobs = [
    { knob = "lifetime", easy = 2.6, hard = 0.6 },
    { knob = "radius", easy = 0.36, hard = 0.2 },
]
