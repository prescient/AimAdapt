name = "Strafe Track"
description = "Keep your crosshair on a strafing body. The beam is always on, so only your aim counts."
author = "RustyAim"
category = "tracking"
tags = ["tracking", "reactive", "strafe"]

[timing]
duration_s = 60.0

[weapon]
kind = "beam"
trigger = "always"
damage_per_s = 100.0

[targets]
count = 1
shape = "capsule"
radius = 0.35
height = 1.7
health = 1000000.0
color = "#4ec3ff"

[targets.spawn]
distance = [12.0, 12.0]
yaw = [-35.0, 35.0]
pitch = [-4.0, 2.0]

[targets.movement]
kind = "strafe"
speed = [3.5, 6.0]
change_every_s = [0.4, 1.4]

[scoring]
per_kill = 0.0
per_damage = 1.0

[adaptive]
goal = 0.85
knobs = [
    { knob = "speed", easy = 2.5, hard = 10.0 },
    { knob = "change_every", easy = 1.8, hard = 0.35 },
]
