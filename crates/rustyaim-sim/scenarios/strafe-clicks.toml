name = "Strafe Clicks"
description = "A body-sized target strafing side to side. Click it within 2 s, usually as it changes direction. Adaptive mode rates the strafe speed at which you land 85% of them. Trains reading movement."
author = "RustyAim"
category = "clicking"
skill = "dynamic_clicking"
tags = ["moving", "strafe"]

