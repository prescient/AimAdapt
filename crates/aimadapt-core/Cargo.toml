[package]
name = "aimadapt-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
# Its own integration tests read the database directly, as other crates' tests do.
aimadapt-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[features]
# Serialize report types (used by the desktop app to send data to its UI).
serde = ["dep:serde", "chrono/serde"]
# Opens up `Db::conn()` for other crates' tests to check what was stored.
test-util = []

[lints]
workspace = true
